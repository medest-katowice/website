{{- $src := .Get "src" -}}
{{- if hasPrefix $src "/" -}}
  {{- $src = (strings.TrimPrefix "/" $src) | relURL -}}
{{- end -}}
{{- $imagePath := strings.TrimPrefix "/" (.Get "src") -}}
{{- $imageConfig := images.Config (printf "static/%s" $imagePath) -}}
<img src="{{ $src }}" alt="{{ .Get "alt" }}" width="{{ $imageConfig.Width }}" height="{{ $imageConfig.Height }}"{{ with .Get "class" }} class="{{ . }}"{{ end }}>
